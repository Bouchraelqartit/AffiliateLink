
spring.application.name=affiliatelink

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/affiliatelink_db
spring.datasource.username=affiliate_user
spring.datasource.password=affiliate_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

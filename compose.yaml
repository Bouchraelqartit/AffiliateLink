
services:
  postgres:
    image: postgres:16
    container_name: affiliatelink-postgres
    environment:
      POSTGRES_DB: affiliatelink_db
      POSTGRES_USER: affiliate_user
      POSTGRES_PASSWORD: affiliate_dev_password
    ports:
      - "5433:5432"
    volumes:
      - affiliatelink_postgres_data:/var/lib/postgresql/data

volumes:
  affiliatelink_postgres_data:
